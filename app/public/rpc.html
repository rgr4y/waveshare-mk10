<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JSON RPC</title>
  <link rel="stylesheet" href="styles.css">
  <script src="../node_modules/monaco-editor/min/vs/loader.js" defer></script>
  <script src="rpc.js" defer></script>
</head>
<body class="rpc">
  <header class="rpc-head">
    <span class="muted">Studio ⇄ KeyboardDevice, USB serial: JSON-RPC and old-style V1 frames. <b>→</b> sent, <b>←</b> received.</span>
    <label class="inline"><input id="rpc-follow" type="checkbox" checked> Follow</label>
    <label class="inline"><input id="rpc-wrap" type="checkbox"> Wrap</label>
    <button id="rpc-clear" type="button">Clear</button>
    <span id="rpc-count" class="muted"></span>
  </header>
  <div id="rpc-editor" class="rpc-editor"></div>
</body>
</html>
